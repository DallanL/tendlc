<div class="p-4 rounded-lg border {% if status == 'Approved' %}bg-green-50 border-green-200 text-green-800{% else %}bg-red-50 border-red-200 text-red-800{% endif %}">
    <div class="flex items-center justify-between mb-2">
        <h3 class="font-bold">{{ title }}</h3>
        <span class="px-2 py-1 rounded text-xs font-bold uppercase {% if status == 'Approved' %}bg-green-200 text-green-900{% else %}bg-red-200 text-red-900{% endif %}">
            {{ status }}
        </span>
    </div>
    <p class="text-sm">{{ feedback }}</p>
</div>
