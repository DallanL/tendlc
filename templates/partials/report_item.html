<div class="p-4 rounded-lg border {% if status == 'Approved' %}bg-green-50 border-green-200 text-green-800{% else %}bg-red-50 border-red-200 text-red-800{% endif %}">
    <div class="flex items-center justify-between mb-2">
        <h3 class="font-bold">{{ title }}</h3>
        <span class="px-2 py-1 rounded text-xs font-bold uppercase {% if status == 'Approved' %}bg-green-200 text-green-900{% else %}bg-red-200 text-red-900{% endif %}">
            {{ status }}
        </span>
    </div>
    <p class="text-sm mb-3">{{ feedback }}</p>

    {% if recommended_changes %}
    <div class="mt-4 pt-3 border-t border-red-200">
        <h4 class="text-xs font-bold uppercase tracking-wider text-red-600 mb-2">Recommended Policy Changes</h4>
        <ul class="space-y-2">
            {% for change in recommended_changes %}
            <li class="text-xs font-mono bg-white bg-opacity-50 p-2 rounded border border-red-100">
                {{ change }}
            </li>
            {% endfor %}
        </ul>
    </div>
    {% endif %}
</div>
