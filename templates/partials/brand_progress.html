<div id="brand-tracker-{{ task_id }}" 
     hx-get="/evaluate/brand/status/{{ task_id }}" 
     hx-trigger="every 1s" 
     hx-swap="outerHTML"
     class="mt-4 p-4 bg-white border border-gray-100 rounded-lg shadow-sm space-y-3">
    <div class="flex justify-between items-center text-xs font-bold uppercase tracking-wider">
        <span class="text-indigo-600 animate-pulse">{{ status }}</span>
        <span class="text-gray-500">{{ progress }}%</span>
    </div>
    <div class="w-full bg-gray-100 rounded-full h-2.5 overflow-hidden">
        <div class="bg-indigo-600 h-full rounded-full transition-all duration-500 ease-out" 
             style="width: {{ progress }}%"></div>
    </div>
</div>
