<div class="space-y-4">
    {% for result in results %}
    <div class="p-4 rounded-lg border {% if result.status == 'Approved' %}bg-green-50 border-green-200 text-green-800{% else %}bg-red-50 border-red-200 text-red-800{% endif %}">
        <div class="flex items-center justify-between mb-2">
            <h3 class="font-bold">{{ result.doc_type }} Vetting</h3>
            <span class="px-2 py-1 rounded text-xs font-bold uppercase {% if result.status == 'Approved' %}bg-green-200 text-green-900{% else %}bg-red-200 text-red-900{% endif %}">
                {{ result.status }}
            </span>
        </div>
        <p class="text-sm mb-3">{{ result.feedback }}</p>

        {% if result.recommended_changes %}
        <div class="mt-4 pt-3 border-t border-red-200">
            <h4 class="text-xs font-bold uppercase tracking-wider text-red-600 mb-2">Recommended Changes</h4>
            <ul class="space-y-2">
                {% for change in result.recommended_changes %}
                <li class="text-xs font-mono bg-white bg-opacity-50 p-2 rounded border border-red-100">
                    {{ change }}
                </li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}
    </div>
    {% endfor %}
</div>
