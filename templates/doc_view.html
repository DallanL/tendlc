{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="mb-6 flex justify-between items-center">
        <a href="/" class="text-indigo-600 hover:text-indigo-800 flex items-center text-sm font-medium">
            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Back to Portal
        </a>
        <button onclick="window.print()" class="text-gray-500 hover:text-gray-800 text-sm flex items-center border border-gray-300 px-3 py-1 rounded">
            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
            Print
        </button>
    </div>

    <div class="bg-white p-8 md:p-12 rounded-xl shadow-md border border-gray-200">
        <div class="prose prose-indigo max-w-none">
            {{ content | safe }}
        </div>
    </div>
</div>

<!-- Add Tailwind Typography plugin for prose styling -->
<script>
    tailwind.config = {
        theme: {
            extend: {},
        },
        plugins: [
            tailwind.plugin(function({ addComponents, theme }) {
                addComponents({
                    '.prose': {
                        'h1': { fontSize: '2.25rem', fontWeight: '800', marginBottom: '1rem', color: theme('colors.gray.900') },
                        'h2': { fontSize: '1.5rem', fontWeight: '700', marginTop: '2rem', marginBottom: '1rem', color: theme('colors.gray.800') },
                        'p': { marginTop: '1rem', marginBottom: '1rem', color: theme('colors.gray.700'), lineHeight: '1.75' },
                        'ul': { listStyleType: 'disc', paddingLeft: '1.5rem', marginTop: '1rem', marginBottom: '1rem' },
                        'li': { marginTop: '0.5rem', marginBottom: '0.5rem' },
                        'strong': { fontWeight: '700', color: theme('colors.gray.900') },
                    }
                })
            })
        ]
    }
</script>
{% endblock %}
